{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Youtube Clone {% endblock %}</title>
    <link rel="stylesheet" href ="{% static 'css/buttons.css' %}">
    <link rel="stylesheet" href ="{% static 'css/base.css' %}">
    <link rel="stylesheet" href ="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href ="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href ="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href ="{% static 'css/upload.css' %}">
    <link rel="stylesheet" href ="{% static 'css/messages.css' %}">

    {% block extra_css %} {% endblock %}

</head>
<body>
    <nav class = 'navbar'>
        <a class = 'navbar-brand'>
        <span class = 'brand-icon'>▶</span> Youtube
        </a>
        <ul class = 'navbar-nav'>
            {% if user.is_authenticated %}
            <li class = nav-item><a class="nav-link btn-upload" href = "{% url 'videos:upload' %}">Upload</a></li>
            <li class = nav-item><a class="nav-link btn-outline" href = "{% url 'accounts:logout' %}">Logout</a></li>
            {% else %}
            <li class = nav-item><a class="nav-link btn-primary" href = "{% url 'accounts:register' %}">Register</a></li>
            <li class = nav-item><a class="nav-link btn-outline" href = "{% url 'accounts:login' %}">Login</a></li>
            {% endif %}
        </ul>
    </nav>
    <main class = "main-container">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
